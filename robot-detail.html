<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robô – Portal Técnico</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <div class="nav-logo-icon">⚙</div>
      Portal<span>Técnico</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">⌂ Home</a></li>
      <li><a href="robots.html" class="active">⚙ Catálogo de Robôs</a></li>
      <li><a href="sensors.html">⚡ Sensores IoT</a></li>
      <li><a href="desafios.html">🎯 Desafios & Vídeos</a></li>
      <li><a href="arduino-esp.html">🎬 Arduino & ESP</a></li>
      <li><a href="questoes.html">✎ Questões SAEP/ENEM</a></li>
    </ul>
  </div>
</nav>

<main class="container" style="padding-top:1.5rem; padding-bottom:3rem;">
  <div class="breadcrumb">
    <a href="robots.html">← Catálogo</a>
    <span class="sep">/</span>
    <span class="current" id="bc-name">…</span>
  </div>

  <div id="content"></div>
</main>

<footer>
  <p>Portal Técnico &mdash; Robótica Industrial &amp; Sensores IoT<br>
  Curso de <span>Internet das Coisas</span> &mdash; SENAI Santa Catarina</p>
</footer>

<script src="js/data.js"></script>
<script>
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const robot = robots.find(r => r.id === id);
  const content = document.getElementById('content');

  if (!robot) {
    content.innerHTML = `<div class="not-found"><h2>Robô não encontrado</h2><p>O ID "${id}" não existe no catálogo.</p><a class="btn btn-primary" href="robots.html">← Voltar ao catálogo</a></div>`;
  } else {
    document.title = `${robot.name} – Portal Técnico`;
    document.getElementById('bc-name').textContent = robot.name;

    // extra sections html
    let extraHtml = '';
    if (robot.extraSections) {
      robot.extraSections.forEach(sec => {
        extraHtml += `<div class="extra-section"><h3>${sec.title}</h3><ul>${sec.content.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
      });
    }

    content.innerHTML = `
      <div class="detail-layout">

        <!-- LEFT COLUMN -->
        <div>
          <img class="detail-img" src="${robot.image}" alt="${robot.name}" />

          <div class="detail-hero">
            <h1>${robot.name}</h1>
            <p class="subtitle">${robot.concept}</p>
          </div>

          <div style="margin: 2rem 0;">
            <div class="section-title">Princípio de Funcionamento</div>
            <div class="principle-box">${robot.workingPrinciple}</div>
          </div>

          <div style="margin: 2rem 0;">
            <div class="section-title">Integração IoT / Industria 4.0</div>
            <div class="principle-box">${robot.integration}</div>
          </div>

          ${extraHtml}
        </div>

        <!-- RIGHT SIDEBAR -->
        <div>
          <div class="specs-card">
            <h3>⚙ Especificações Técnicas</h3>
            <div class="specs-grid">
              <div class="spec-item"><dt>Velocidade</dt><dd>${robot.specs.speed}</dd></div>
              <div class="spec-item"><dt>Carga Útil (Payload)</dt><dd>${robot.specs.payload}</dd></div>
              <div class="spec-item"><dt>Precisão / Repetibilidade</dt><dd class="highlight">${robot.specs.precision}</dd></div>
              <div class="spec-item"><dt>Complexidade de Implementação</dt><dd>${robot.specs.implementationComplexity}</dd></div>
              <div class="spec-item" style="grid-column:span 2"><dt>Custo Relativo</dt><dd>${robot.specs.relativeCost}</dd></div>
            </div>

            <div class="sidebar-section">
              <h3>Aplicações Principais</h3>
              <ul class="app-list">${robot.applications.map(a => `<li>${a}</li>`).join('')}</ul>
            </div>

            <div class="sidebar-section">
              <h3>Modelos Comerciais</h3>
              <div class="model-tags">${robot.models.map(m => `<span class="model-tag">${m}</span>`).join('')}</div>
            </div>
          </div>

          <div style="margin-top:1rem;">
            <a href="robots.html" class="btn btn-outline" style="width:100%;justify-content:center;">← Voltar ao catálogo</a>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
